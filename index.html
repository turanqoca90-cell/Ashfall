function snd(ty,f0,f1,dur,vol){const a=muted?null:ac();if(!a)return;const t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(a.destination);

 for(const r of RL){const sv=p;p={x:r.x,y:r.y,a:r.a,fl:r.fl,sp:r.sp,wk:r.wk,inv:[{k:'w',s:0,i:r.w||0}],sel:r.w?0:-1,col:PC[r.c||0]};drawP();p=sv;ctx.font='700 12px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(r.n,r.x,r.y-24);ctx.fillStyle='#fff';ctx.fillText(r.n,r.x,r.y-24);const hp=Math.max(0,Math.min(100,r.hp==null?100:r.hp));ctx.fillStyle='#000';ctx.fillRect(r.x-16,r.y-21,32,5);ctx.fillStyle=hp>50?'#4caf50':hp>25?'#e0a030':'#c8483a';ctx.fillRect(r.x-15,r.y-20,30*hp/100,3)}
 if(p)drawP();drawBushes(px,py,vw,vh);
 for(const b of vis){const o=p&&inside(p,b);ctx.globalAlpha=o?.12:1;roofB(b)}
 ctx.globalAlpha=1;
 for(const b of vis)for(const d of b.dr){
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.r);
  ctx.fillStyle='#3a3630';ctx.fillRect(-24,-10,48,10);
  ctx.fillStyle='#e0803a';ctx.fillRect(-27,-11,3,13);ctx.fillRect(24,-11,3,13);
  ctx.fillStyle='#c9a96a';ctx.fillRect(-27,2,54,8);
  ctx.fillStyle='#7a5a2a';ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(0,3);ctx.lineTo(8,8);ctx.lineTo(0,6.5);ctx.fill();ctx.restore()}
 ctx.restore();
 for(const k of['l','r']){const s=st[k],hx=k==='l'?W*.2:W*.8,hy=H*.72;ctx.strokeStyle='rgba(236,230,210,.3)';ctx.lineWidth=3;ctx.beginPath();
  if(s.id===null){ctx.arc(hx,hy,44,0,TAU);ctx.stroke()}else{ctx.arc(s.ox,s.oy,50,0,TAU);ctx.stroke();const d=Math.hypot(s.x-s.ox,s.y-s.oy),m=Math.min(d,50)/(d||1);ctx.fillStyle='rgba(236,230,210,.35)';ctx.beginPath();ctx.arc(s.ox+(s.x-s.ox)*m,s.oy+(s.y-s.oy)*m,22,0,TAU);ctx.fill()}}}
function bm(g,b,s,mn){if(b.cells)for(const[r,k]of b.cells)g.fillRect((b.x+k*b.S)*s,(b.y+r*b.S)*s,Math.max(mn,b.S*s),Math.max(mn,b.S*s));else g.fillRect(b.x*s,b.y*s,Math.max(mn,b.w*s),Math.max(mn,b.h*s))}
function mini(){
 const g=mm.getContext('2d'),s=216/WS;g.clearRect(0,0,216,216);g.fillStyle='rgba(22,24,19,.9)';g.fillRect(0,0,216,216);
 g.fillStyle='rgba(120,92,52,.5)';g.beginPath();g.arc(108,108,108*.65,0,TAU);g.fill();g.fillStyle='rgba(190,70,50,.55)';g.beginPath();g.arc(108,108,108*.3,0,TAU);g.fill();
 g.fillStyle='#b9b09a';bl.forEach(b=>bm(g,b,s,3));
 if(p){g.fillStyle='#fff';g.beginPath();g.arc(p.x*s,p.y*s,5,0,TAU);g.fill()}
 RL.forEach(r=>{g.fillStyle=PC[r.c||0];g.beginPath();g.arc(r.x*s,r.y*s,5,0,TAU);g.fill()})}
const setH=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
function hud(){if(!p)return;$('hp').style.width=Math.max(0,p.hp)+'%';
 setH($('inf'),'<span class="st">'+(cw()!==WP[0]?stars(cw().st)+' ':'')+'</span>'+cw().nm+'<br>Kills '+kills);
 setH($('zone'),ZN[zoneAt(p.x,p.y)]+(ROOM?'<br>'+(RL.length+1)+' online':'')+(p.hid?'<br>Hidden':''));
 const c=paused?null:nearCrate();$('lootb').style.display=c&&!srch?'block':'none';
 const gx=paused?-1:nearG();$('swapb').style.display=gx>=0?'block':'none';if(gx>=0){const nm=it=>stars(it.s)+' '+(it.k==='w'?WP[it.i].nm:HL[it.s]),t=swapTarget(gi[gx]);setH($('swapb'),'Replace '+(t>=0?nm(p.inv[t]):'item')+' with '+nm(gi[gx]))}
 $('fullb').style.display=fullNow&&!paused?'block':'none';
 }
let _fr=0,last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;RL=remotes(dt);net(dt);for(let i=beams.length-1;i>=0;i--){beams[i].t-=dt;if(beams[i].t<=0)beams.splice(i,1)}if(p&&!paused&&!mapOpen)update(dt);draw();flash();if((_fr=(_fr+1)%4)===0)mini();if(mapOpen)bigmap();hud();requestAnimationFrame(loop)}

<script>
/* server connection: accounts, shared zombies, multiplayer */
let WSK=null,SID=0,PL=[],zmap={},spawnT=0;
function sendWS(o){if(WSK&&WSK.readyState===1)WSK.send(JSON.stringify(o))}
function connect(){return new Promise(res=>{let ws,done=false;
 try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host)}catch(e){return res(false)}
 ws.onopen=()=>{WSK=ws;done=true;res(true)};
 ws.onerror=()=>{if(!done){done=true;res(false)}};
 ws.onclose=()=>{WSK=null;ROOM=null;ACC=null;if(p&&!paused){paused=true;$('card').innerHTML='<h1>Disconnected</h1><p class="sub">Lost the connection to the server.</p><button class="big" onclick="location.reload()">Reconnect</button>';$('ov').classList.remove('hide')}};
 ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(err){}}})}
function onMsg(m){
 if(m.t==='authok'){prof=m.prof;ACC=true;ROOM={};
  if(m.tok){try{localStorage.setItem('ash_cred',JSON.stringify({u:m.prof.name,tok:m.tok}))}catch(e){}}
  if(m.r)loginUI2();else drop()}
 else if(m.t==='autherr'){if(m.r){try{localStorage.removeItem('ash_cred')}catch(e){}loginUI2()}else loginUI2(m.m)}
 else if(m.t==='s')snap(m);else if(m.t==='got')gotItem(m)}
function gotItem(m){const it=m.it;
 if(m.sw&&pendSw>=0&&p&&p.inv[pendSw]){p.inv[pendSw]={k:it.k,s:it.s,i:it.i};renderInv()}
 else if(!p||!addItem(it)){if(p)sendWS({t:'drop',k:it.k,s:it.s,i:it.i});return}
 pendSw=-1;snd('triangle',620,900,.07,.16);setTimeout(()=>snd('triangle',900,1300,.09,.14),70);toast(stars(it.s)+' '+(it.k==='w'?WP[it.i].nm:HL[it.s]))}
function snap(m){SID=m.i;PL=m.p;gi=(m.gi||[]).map(e=>({id:e[0],x:e[1],y:e[2],k:e[3]?'h':'w',s:e[4],i:e[5],h:e[6],ttl:e[7]}));cm={};for(const e of m.c||[])cm[e[0]]=e[1];
 const nz=[],seen={};
 for(const e of m.z){seen[e[0]]=1;let z=zmap[e[0]];if(!z)z=zmap[e[0]]={x:e[1],y:e[2],ph:e[0]*1.7%6};
  z.id=e[0];z.tx=e[1];z.ty=e[2];z.a=e[3]/100;z.hp=e[4];z.mh=e[5];z.kd=e[6];z.rs=e[7]/10;z.ag=e[8];z.hit=e[9]?.1:0;z.zn=zoneAt(e[1],e[2]);nz.push(z)}
 for(const k in zmap)if(!seen[k]){const z=zmap[k];if(p){const d=Math.hypot(z.x-p.x,z.y-p.y);if(d<700)snd('sawtooth',170,40,.3,.05+.18*(1-d/700))}delete zmap[k]}
 zs=nz;
 if(p&&!paused&&performance.now()-spawnT>800){if(m.me.hp<p.hp-1){snd('sawtooth',200,80,.15,.18);p.hf=.2}p.hp=m.me.hp;kills=m.me.k;if(m.me.hp<=0)die()}}
function auth(su){const n=$('nm').value.trim(),pw=$('pw').value;
 if(n.length<3)return loginUI2('Username needs 3 or more letters or numbers.');
 if(pw.length<4)return loginUI2('Password needs 4 or more characters.');
 $('go').disabled=true;sendWS({t:'auth',m:su?'signup':'login',u:n,pw})}
function save(){}
function net(dt){pt-=dt;if(pt>0||!WSK)return;pt=.1;
 if(p&&!paused&&prof)sendWS({t:'pos',x:Math.round(p.x),y:Math.round(p.y),a:+p.a.toFixed(2),w:WP.indexOf(cw()),c:nh(prof.name)})}
function remotes(dt){const out=[],seen={};
 for(const q of PL){if(q[0]===SID)continue;seen[q[0]]=1;const pr={n:q[1],x:q[2],y:q[3],a:q[4],w:q[5],c:q[6],f:q[7],fa:q[8],hp:q[9]};
  let r=rp[q[0]];if(!r)r=rp[q[0]]={x:pr.x,y:pr.y,a:pr.a,f:pr.f,wk:0,fl:0,sp:0};
  const dx=pr.x-r.x,dy=pr.y-r.y;r.x+=dx*Math.min(1,dt*12);r.y+=dy*Math.min(1,dt*12);r.sp=Math.min(1,Math.hypot(dx,dy)/12);r.wk+=r.sp*dt*11;
  r.a+=Math.atan2(Math.sin(pr.a-r.a),Math.cos(pr.a-r.a))*Math.min(1,dt*14);r.w=pr.w;r.n=pr.n;r.c=pr.c;r.hp=pr.hp;
  if(pr.f<r.f)r.f=pr.f;
  if(pr.f>r.f){const n=Math.min(3,pr.f-r.f),w=WP[pr.w]||WP[0];r.f=pr.f;r.fl=.07;
   if(w.beam)beams.push({x:r.x,y:r.y,a:pr.fa,L:beamLen(r.x,r.y,pr.fa,w.rg),t:.2});else if(!w.me)for(let k=0;k<n*w.pel;k++){const a=pr.fa+sprd(w),sp=w.sp||700;bs.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:w.rg/sp,d:w.d})}}
  r.fl-=dt;out.push(r)}
 for(const k in rp)if(!seen[k])delete rp[k];
 const f=Math.min(1,dt*12);for(const z of zs){z.x+=(z.tx-z.x)*f;z.y+=(z.ty-z.y)*f}
 return out}
const _drop=drop;
drop=function(){_drop();spawnT=performance.now();p.hp=100;sendWS({t:'spawn',x:p.x,y:p.y})};
async function initNet(){
 ACC=null;loginUI2('Connecting to the server. If it was asleep, this can take about a minute.');
 let ok=false;for(let i=0;i<14&&!ok;i++){ok=await connect();if(!ok)await sleep(5000)}
 if(!ok)return loginUI2('Could not reach the server. Reload to try again.');
 ACC=true;ROOM={};let c=null;try{c=JSON.parse(localStorage.getItem('ash_cred')||'null')}catch(e){}
 if(c)sendWS({t:'resume',u:c.u,tok:c.tok});else loginUI2()}
initNet();
</script></body></html>
