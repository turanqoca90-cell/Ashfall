<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12140f}}
:root[data-theme="dark"]{--bg:#12140f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh}
.z{position:fixed;top:0;bottom:0;width:50%;touch-action:none}#zl{left:0}#zr{right:0}
.tl{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:164px;pointer-events:none}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#c8483a}

.act button{padding:14px 18px;font-size:16px;font-weight:700;display:none}
#lootb{background:var(--acc);color:#1a1c17;border-color:var(--acc)}

#toast.show{opacity:1;transform:translate(-50%,-22px)}

#ov.hide{display:none}

h1{margin:0 0 6px;font-size:36px;letter-spacing:.04em}
.sub{margin:0 0 14px;font-size:14px;opacity:.8;line-height:1.35}
input{width:100%;box-sizing:border-box;padding:12px;font:inherit;font-size:16px;text-align:center;border-radius:12px;border:1.5px solid var(--line);background:#14160f;color:var(--ink);margin-bottom:10px}
.big{display:block;width:100%;padding:13px;font-size:18px;font-weight:700;background:var(--acc);color:#1a1c17;border-color:var(--acc)}
.note{margin:12px 0 0;font-size:12px;opacity:.65}
#inv{display:flex;gap:5px;margin-bottom:8px}
.sl{width:35px;height:35px;border-radius:8px;border:2px solid var(--line);background:var(--panel);pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1;padding:0;color:var(--ink)}
.sl small{font-size:8px;color:var(--star);margin-top:2px}
.sl.eq{outline:2px solid var(--acc);outline-offset:1px}
#swapb{border-color:var(--acc);color:var(--acc)}
#bigmap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,8,.94);z-index:5}
#bm{width:min(92vw,80vh);height:min(92vw,80vh);border:2px solid var(--line);border-radius:12px}
#bigmap p{margin:10px 0 0;font-size:13px;opacity:.7}
.sm{display:block;width:100%;padding:10px;margin-top:8px;font-size:14px}
#fullb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:180px;right:128px;text-align:center;font-size:11px;font-weight:700;color:var(--acc);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:3px 0;white-space:nowrap;overflow:hidden;pointer-events:none;display:none}
#mute{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 148px);width:108px;padding:4px;font-size:11px}
</style></head><body>
<canvas id="c"></canvas><div class="z" id="zl"></div><div class="z" id="zr"></div>
<div class="tl"><div id="inv"></div><div class="bar"><i id="hp"></i></div><p id="inf"></p></div>
<canvas id="mm" width="216" height="216"></canvas><div id="zone"></div><button id="mute">Sound on</button><div id="fullb">Inventory full</div><div id="bigmap"><canvas id="bm" width="720" height="720"></canvas><p>Tap anywhere to close</p></div>
<div class="act"><button id="lootb">Search</button><button id="swapb">Swap</button></div>
<div id="toast"></div>
<div id="ov"><div class="card" id="card"><p class="sub">Loading…</p></div></div>
<script>
const WS=6400,TAU=Math.PI*2,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),mm=$('mm');let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}addEventListener('resize',rs);rs();
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const zoneAt=(x,y)=>{const d=Math.hypot(x-WS/2,y-WS/2)/(WS/2);return d<.3?3:d<.65?2:1};
const ZN=['','Outskirts','Midlands','The Core'],RF=['#7a5c4a','#5f6b73','#6b5d78','#8a7a55','#4f6a5a'];
const WP=[{nm:'Fists',d:10,rate:.5,pel:1,spr:0,rg:34},{nm:'Pistol',d:22,rate:.4,pel:1,spr:.04,rg:480},{nm:'SMG',d:13,rate:.11,pel:1,spr:.14,rg:420},{nm:'Shotgun',d:11,rate:.75,pel:6,spr:.4,rg:300},{nm:'Rifle',d:42,rate:.3,pel:1,spr:.02,rg:640},{nm:'Plasma gun',d:28,rate:.07,pel:1,spr:.06,rg:560}];
const HL=['','Bandage','Painkillers','Medkit','Trauma kit','Surgery kit'],WT=[0,[60,30,9,1,0],[22,38,26,12,2],[4,16,32,32,16]];
const bl=[],walls=[],trees=[],R0=rng(7);
for(let i=0;i<24;i++)for(let j=0;j<24;j++){if(R0()>.34)continue;
 const ty=R0(),tp=ty<.4?0:ty<.65?1:ty<.85?2:3,w=[125+R0()*30,190+R0()*10,160+R0()*25,105+R0()*15][tp]|0,h=[100+R0()*20,140+R0()*10,110+R0()*15,100+R0()*10][tp]|0,x=i*266+133-w/2+(R0()-.5)*40,y=j*266+133-h/2+(R0()-.5)*40,t=10,g=48,ws=[
 {x,y,w,h:t},{x,y,w:t,h},{x:x+w-t,y,w:t,h},{x,y:y+h-t,w:(w-g)/2,h:t},{x:x+(w+g)/2,y:y+h-t,w:(w-g)/2,h:t}];
 ws.forEach(q=>walls.push(q));
 bl.push({x,y,w,h,z:zoneAt(x+w/2,y+h/2),c:RF[Math.floor(R0()*5)],t:tp,cr:(tp===1?[.22,.5,.78]:[.3,.7]).map(f=>({x:x+w*f,y:y+h*.42,t:0}))})}
for(let i=0;i<700;i++){const x=R0()*WS,y=R0()*WS,r=22+R0()*10;if(bl.some(b=>x>b.x-r-12&&x<b.x+b.w+r+12&&y>b.y-r-12&&y<b.y+b.h+r+12))continue;trees.push([x,y,r])}
function push(o,r){for(const q of walls){if(o.x<q.x-r||o.x>q.x+q.w+r||o.y<q.y-r||o.y>q.y+q.h+r)continue;const nx=Math.max(q.x,Math.min(o.x,q.x+q.w)),ny=Math.max(q.y,Math.min(o.y,q.y+q.h)),dx=o.x-nx,dy=o.y-ny,d2=dx*dx+dy*dy;
 if(d2<r*r){if(d2>1e-4){const d=Math.sqrt(d2),f=(r-d)/d;o.x+=dx*f;o.y+=dy*f}else o.y-=r}}
 o.x=Math.max(r,Math.min(WS-r,o.x));o.y=Math.max(r,Math.min(WS-r,o.y))}
const inWall=(x,y,m=0)=>walls.some(q=>x>q.x-m&&x<q.x+q.w+m&&y>q.y-m&&y<q.y+q.h+m);
const inside=(o,b)=>o.x>b.x+10&&o.x<b.x+b.w-10&&o.y>b.y+10&&o.y<b.y+b.h-10;
/* account */
let DB=null,prof=null,paused=true;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initAcc(){
 try{for(let i=0;i<30&&!window.claude;i++)await sleep(100);
  if(window.claude){const[db,u]=await Promise.race([Promise.all([claude.use('db'),claude.use('user')]),sleep(6000).then(()=>[null,null])]);
   if(db&&u){const id=await u.id();if(id)DB=db.collection('data/users/'+id)}}}catch(e){}
 let p=null;try{if(DB){const s=await DB.doc('ashfall').get();if(s.exists)p=s.data()}else p=JSON.parse(localStorage.getItem('ash')||'null')}catch(e){}
 prof=p;loginUI()}
async function save(){if(!prof)return;const d={name:prof.name,kills:prof.kills,deaths:prof.deaths,best:prof.best,stash:prof.stash||[]};
 try{if(DB)await DB.doc('ashfall').set(d);else localStorage.setItem('ash',JSON.stringify(d))}catch(e){}}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
const note=()=>'<p class="note">'+(DB?'Signed in through claude.ai. Your progress is saved to your account.':'Guest mode: progress is saved on this device only.')+'</p>';
function loginUI(){
 $('card').innerHTML=prof?'<h1>ASHFALL</h1><p class="sub">Welcome back, <b>'+esc(prof.name)+'</b><br>'+prof.kills+' kills · '+prof.deaths+' deaths</p><button class="big" id="go">Drop in</button>'+note()
 :'<h1>ASHFALL</h1><p class="sub">Pick a callsign to create your survivor. You drop in with nothing. Loot buildings to arm up.</p><input id="nm" maxlength="14" placeholder="Callsign"><button class="big" id="go">Sign up and drop in</button>'+note();
 $('go').onclick=()=>{if(!prof){const n=($('nm').value||'').trim();if(!n){$('nm').focus();return}prof={name:n,kills:0,deaths:0,best:0,stash:[]};save()}drop()}}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* game state */
let p,zs=[],bs=[],gi=[],srch=null,kills=0,life=0,spT=0,tt,muted=false,AC=null,gro=0,fullT=0,fullNow=false,fps=[],mapOpen=false,lt=0,li=-1;
const IC=['','#9aa08c','#6fb06a','#4d9de0','#a56bd6','#f2c14e'],AB=['','PST','SMG','SHT','RFL','PLS'];
const cw=()=>{const s=p&&p.sel>=0?p.inv[p.sel]:null;return s&&s.k==='w'?WP[s.s]:WP[0]};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function snd(ty,f0,f1,dur,vol){const a=muted?null:ac();if(!a)return;const t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(a.destination);
 if(ty==='n'){const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=f0;s.connect(f);f.connect(g);s.start(t)}
 else{const o=a.createOscillator();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);o.connect(g);o.start(t);o.stop(t+dur)}}
const fireSnd=w=>{[()=>snd('n',500,0,.06,.2),()=>snd('n',2500,0,.09,.22),()=>snd('n',3200,0,.05,.18),()=>snd('n',1100,0,.22,.35),()=>snd('n',1800,0,.14,.3),()=>snd('sawtooth',900,200,.1,.1)][WP.indexOf(w)]()};
$('mm').onclick=()=>{if(paused||!p)return;mapOpen=true;$('bigmap').style.display='flex'};
$('bigmap').onclick=()=>{mapOpen=false;$('bigmap').style.display='none'};
function bigmap(){const c=$('bm'),g=c.getContext('2d'),S=c.width,s=S/WS;
 g.fillStyle='#5a6144';g.fillRect(0,0,S,S);
 g.fillStyle='rgba(120,92,52,.4)';g.beginPath();g.arc(S/2,S/2,S/2*.65,0,TAU);g.fill();
 g.fillStyle='rgba(190,70,50,.45)';g.beginPath();g.arc(S/2,S/2,S/2*.3,0,TAU);g.fill();
 g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;
 for(let i=0;i<=8;i++){const v=i*S/8;g.beginPath();g.moveTo(v,0);g.lineTo(v,S);g.moveTo(0,v);g.lineTo(S,v);g.stroke()}
 bl.forEach(b=>{g.fillStyle=b.c;g.fillRect(b.x*s,b.y*s,Math.max(5,b.w*s),Math.max(5,b.h*s))});
 g.fillStyle='rgba(255,255,255,.85)';g.font='700 18px sans-serif';g.textAlign='center';
 for(let i=0;i<8;i++){g.fillText('ABCDEFGH'[i],(i+.5)*S/8,20);g.fillText(String(i+1),14,(i+.5)*S/8+6)}
 g.font='700 22px sans-serif';g.fillText('THE CORE',S/2,S/2+8);g.fillText('MIDLANDS',S/2,S/2-S/2*.47);g.fillText('OUTSKIRTS',S/2,S-16);
 RL.forEach(r=>{g.fillStyle=PC[r.c||0];g.strokeStyle='#26211c';g.lineWidth=3;g.beginPath();g.arc(r.x*s,r.y*s,9,0,TAU);g.fill();g.stroke();g.fillStyle='#fff';g.font='700 16px sans-serif';g.fillText(r.n,r.x*s,r.y*s-14)});
 if(p){const x=p.x*s,y=p.y*s;g.save();g.translate(x,y);g.rotate(p.a);g.fillStyle='#fff';g.strokeStyle='#26211c';g.lineWidth=3;g.beginPath();g.moveTo(14,0);g.lineTo(-9,-9);g.lineTo(-9,9);g.closePath();g.fill();g.stroke();g.restore();
  g.strokeStyle='#e0803a';g.lineWidth=3;g.beginPath();g.arc(x,y,20+Math.sin(performance.now()/300)*3,0,TAU);g.stroke()}}
function los(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/8);for(let i=1;i<n;i++){const t=i/n;if(inWall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}return true}
function renderInv(){const el=$('inv');el.innerHTML='';p.inv.forEach((it,i)=>{const b=document.createElement('button');b.className='sl'+(i===p.sel?' eq':'');
 if(it){b.style.borderColor=IC[it.s];b.innerHTML=(it.k==='w'?AB[it.s]:'+')+'<small>'+stars(it.s)+'</small>'}
 b.onclick=()=>slotTap(i);el.appendChild(b)})}
function addItem(it){const i=p.inv.indexOf(null);if(i<0)return false;p.inv[i]={k:it.k,s:it.s};
 if(it.k==='w'){const cur=p.sel>=0?p.inv[p.sel]:null;if(!cur||it.s>cur.s||cur===p.inv[i])p.sel=i}
 renderInv();return true}
function dropItem(i){const it=p.inv[i];p.inv[i]=null;if(p.sel===i)p.sel=-1;gi.push({x:p.x+Math.cos(p.a)*26,y:p.y+Math.sin(p.a)*26,k:it.k,s:it.s,hold:1});renderInv()}
function slotTap(i){const it=p.inv[i];if(!it||paused)return;const n=performance.now();
 if(li===i&&n-lt<350){dropItem(i);li=-1;return}li=i;lt=n;
 if(it.k==='w'){p.sel=p.sel===i?-1:i;snd('sine',500,500,.05,.08)}
 else{if(p.hp>=100){toast('Health is full');return}p.hp=Math.min(100,p.hp+20*it.s);sendWS({t:'heal',a:20*it.s});p.inv[i]=null;snd('sine',400,800,.25,.15);toast('+'+20*it.s+' HP')}
 renderInv()}
function drop(){
 let x,y,n=0;do{const e=Math.random()*4|0,r=60+Math.random()*(WS-120);x=e<2?r:(e===2?50:WS-50);y=e<2?(e?50:WS-50):r;n++}while(inWall(x,y,40)&&n<50);
 p={x,y,a:0,hp:100,inv:[null,null,null,null],sel:-1,cd:0,col:PC[nh(prof.name)]};zs=[];bs=[];gi=[];fps=[];srch=null;kills=0;life=0;paused=false;ac();renderInv();$('ov').classList.add('hide')}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}
const stars=n=>'★'.repeat(n);
function die(){paused=true;snd('sawtooth',220,30,.9,.25);prof.deaths++;prof.kills+=kills;prof.best=Math.max(prof.best,Math.round(life));save();
 $('card').innerHTML='<h1>You died</h1><p class="sub">'+kills+' zombies down · survived '+Math.floor(life/60)+':'+String(Math.floor(life%60)).padStart(2,'0')+'<br>Your gear is gone. Drop back in with nothing.</p><button class="big" id="go">Drop in again</button>'+note();
 $('go').onclick=drop;$('ov').classList.remove('hide')}
/* accounts v2 + multiplayer */
const enc=new TextEncoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},k,256))}
let ACC=null,ROOM=null,cred=null,RL=[],pt=0;const rp={};
const ukey=n=>n.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
const PC=['#d9692b','#3b8fd9','#c94a7a','#7a52c9','#2fa37a','#c9a02f'],nh=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%6};
const note2=()=>'<p class="note">'+(ACC?'Accounts are saved online. Do not reuse a real password.':'Offline mode: saved on this device only.')+'</p>'+(ROOM?'':'<p class="note">Multiplayer is not available here.</p>');
async function initAcc2(){
 try{for(let i=0;i<30&&!window.claude;i++)await sleep(100);
  if(window.claude){const[db,room]=await Promise.race([Promise.all([claude.use('db'),claude.use('room')]),sleep(6000).then(()=>[null,null])]);if(db)ACC=db.collection('accounts');ROOM=room}}catch(e){}
 try{cred=JSON.parse(localStorage.getItem('ash_cred')||'null')}catch(e){}
 if(!ACC){try{prof=JSON.parse(localStorage.getItem('ash')||'null')}catch(e){}return loginUI2()}
 if(cred){try{const s=await ACC.doc(ukey(cred.n)).get();if(s.exists&&s.data().hash===cred.h)prof=s.data()}catch(e){}}
 loginUI2()}
function loginUI2(msg){
 $('card').innerHTML=prof?`<h1>ASHFALL</h1><p class="sub">Welcome back, <b>${esc(prof.name)}</b><br>${prof.kills} kills · ${prof.deaths} deaths</p><button class="big" id="go">Drop in</button><button class="sm" id="lo">Log out</button>`+note2()
 :`<h1>ASHFALL</h1><p class="sub">${esc(msg||'Log in or sign up. You drop in with nothing.')}</p><input id="nm" maxlength="14" placeholder="Username" autocomplete="username"><input id="pw" type="password" maxlength="40" placeholder="Password" autocomplete="current-password"><button class="big" id="go">Log in</button><button class="sm" id="su">Sign up</button>`+note2();
 if(prof){$('go').onclick=drop;$('lo').onclick=()=>{try{localStorage.removeItem('ash_cred')}catch(e){}prof=null;cred=null;loginUI2()}}
 else{$('go').onclick=()=>auth(0);$('su').onclick=()=>auth(1)}}
async function auth(su){const n=$('nm').value.trim(),pw=$('pw').value,k=ukey(n);
 if(n.length<3||k.length<3)return loginUI2('Username needs 3 or more letters or numbers.');
 if(pw.length<4&&ACC)return loginUI2('Password needs 4 or more characters.');
 if(!ACC){prof={name:n,kills:0,deaths:0,best:0};try{const o=JSON.parse(localStorage.getItem('ash')||'null');if(o&&o.name===n)prof=o}catch(e){}drop();return}
 $('go').disabled=true;
 try{const ref=ACC.doc(k),s=await ref.get();
  if(su){if(s.exists)return loginUI2('That username is taken.');const salt=crypto.getRandomValues(new Uint8Array(16)),h=await hashPw(pw,salt);prof={name:n,salt:b64(salt),hash:h,kills:0,deaths:0,best:0};await ref.set(prof)}
  else{if(!s.exists)return loginUI2('No such user. Try Sign up.');const d=s.data(),h=await hashPw(pw,unb(d.salt));if(h!==d.hash)return loginUI2('Wrong password.');prof=d}
  cred={n:prof.name,h:prof.hash};try{localStorage.setItem('ash_cred',JSON.stringify(cred))}catch(e){}

<script>
/* server connection: accounts, shared zombies, multiplayer */
let WSK=null,SID=0,PL=[],zmap={},spawnT=0;
function sendWS(o){if(WSK&&WSK.readyState===1)WSK.send(JSON.stringify(o))}
function connect(){return new Promise(res=>{let ws,done=false;
 try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host)}catch(e){return res(false)}
 ws.onopen=()=>{WSK=ws;done=true;res(true)};
 ws.onerror=()=>{if(!done){done=true;res(false)}};
 ws.onclose=()=>{WSK=null;ROOM=null;ACC=null;if(p&&!paused){paused=true;$('card').innerHTML='<h1>Disconnected</h1><p class="sub">Lost the connection to the server.</p><button class="big" onclick="location.reload()">Reconnect</button>';$('ov').classList.remove('hide')}};
 ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(err){}}})}
function onMsg(m){
 if(m.t==='authok'){prof=m.prof;ACC=true;ROOM={};
  if(m.tok){try{localStorage.setItem('ash_cred',JSON.stringify({u:m.prof.name,tok:m.tok}))}catch(e){}}
  if(m.r)loginUI2();else drop()}
 else if(m.t==='autherr'){if(m.r){try{localStorage.removeItem('ash_cred')}catch(e){}loginUI2()}else loginUI2(m.m)}
 else if(m.t==='s')snap(m)}
function snap(m){SID=m.i;PL=m.p;
 const nz=[],seen={};
 for(const e of m.z){seen[e[0]]=1;let z=zmap[e[0]];if(!z)z=zmap[e[0]]={x:e[1],y:e[2],ph:e[0]*1.7%6};
  z.id=e[0];z.tx=e[1];z.ty=e[2];z.a=e[3]/100;z.hp=e[4];z.mh=e[5];z.kd=e[6];z.rs=e[7]/10;z.ag=e[8];z.hit=e[9]?.1:0;z.zn=zoneAt(e[1],e[2]);nz.push(z)}
 for(const k in zmap)if(!seen[k])delete zmap[k];
 zs=nz;
 if(p&&!paused&&performance.now()-spawnT>800){if(m.me.hp<p.hp-1)snd('sawtooth',200,80,.15,.18);p.hp=m.me.hp;kills=m.me.k;if(m.me.hp<=0)die()}}
function auth(su){const n=$('nm').value.trim(),pw=$('pw').value;
 if(n.length<3)return loginUI2('Username needs 3 or more letters or numbers.');
 if(pw.length<4)return loginUI2('Password needs 4 or more characters.');
 $('go').disabled=true;sendWS({t:'auth',m:su?'signup':'login',u:n,pw})}
function save(){}
function net(dt){pt-=dt;if(pt>0||!WSK)return;pt=.1;
 if(p&&!paused&&prof)sendWS({t:'pos',x:Math.round(p.x),y:Math.round(p.y),a:+p.a.toFixed(2),w:WP.indexOf(cw()),c:nh(prof.name)})}
function remotes(dt){const out=[],seen={};
 for(const q of PL){if(q[0]===SID)continue;seen[q[0]]=1;const pr={n:q[1],x:q[2],y:q[3],a:q[4],w:q[5],c:q[6],f:q[7],fa:q[8]};
  let r=rp[q[0]];if(!r)r=rp[q[0]]={x:pr.x,y:pr.y,a:pr.a,f:pr.f,wk:0,fl:0,sp:0};
  const dx=pr.x-r.x,dy=pr.y-r.y;r.x+=dx*Math.min(1,dt*12);r.y+=dy*Math.min(1,dt*12);r.sp=Math.min(1,Math.hypot(dx,dy)/12);r.wk+=r.sp*dt*11;
  r.a+=Math.atan2(Math.sin(pr.a-r.a),Math.cos(pr.a-r.a))*Math.min(1,dt*14);r.w=pr.w;r.n=pr.n;r.c=pr.c;
  if(pr.f<r.f)r.f=pr.f;
  if(pr.f>r.f){const n=Math.min(3,pr.f-r.f),w=WP[pr.w]||WP[0];r.f=pr.f;r.fl=.07;
   if(pr.w>0)for(let k=0;k<n*w.pel;k++){const a=pr.fa+(Math.random()-.5)*w.spr*2;bs.push({x:r.x,y:r.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,l:w.rg/700,d:w.d})}}
  r.fl-=dt;out.push(r)}
 for(const k in rp)if(!seen[k])delete rp[k];
 const f=Math.min(1,dt*12);for(const z of zs){z.x+=(z.tx-z.x)*f;z.y+=(z.ty-z.y)*f}
 return out}
const _drop=drop;
drop=function(){_drop();spawnT=performance.now();p.hp=100;sendWS({t:'spawn',x:p.x,y:p.y})};
async function initNet(){
 ACC=null;loginUI2('Connecting to the server. If it was asleep, this can take about a minute.');
 let ok=false;for(let i=0;i<14&&!ok;i++){ok=await connect();if(!ok)await sleep(5000)}
 if(!ok)return loginUI2('Could not reach the server. Reload to try again.');
 ACC=true;ROOM={};let c=null;try{c=JSON.parse(localStorage.getItem('ash_cred')||'null')}catch(e){}
 if(c)sendWS({t:'resume',u:c.u,tok:c.tok});else loginUI2()}
initNet();
